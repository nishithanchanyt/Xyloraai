<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xylora AI – Your Intelligent Assistant</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
      <div class="login-card">
        <div class="logo">
          <div class="logo-icon">✨</div>
          <h1>Xylora AI</h1>
        </div>
        <p class="subtitle">Sign in to start chatting with your AI assistant</p>
        <button id="google-login-btn" class="btn-google">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google logo" width="20">
          <span>Continue with Google</span>
        </button>
        <p class="terms">By continuing, you agree to Xylora's Terms and Privacy Policy</p>
      </div>
    </div>

    <!-- Main Chat Interface -->
    <div id="chat-screen" class="chat-container hidden">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h2>Xylora AI</h2>
          <button id="new-chat-btn" class="new-chat">+ New Chat</button>
        </div>
        <div class="conversation-list" id="conversation-list">
        </div>
        <div class="sidebar-footer">
          <div class="user-mini">
            <img id="sidebar-avatar" src="" alt="user">
            <span id="sidebar-name"></span>
          </div>
          <button id="logout-btn" class="logout-btn">Logout</button>
        </div>
      </aside>

      <!-- Main Chat Area -->
      <main class="main-chat">
        <header class="chat-header">
          <div class="header-left">
            <button id="toggle-sidebar-btn" class="icon-btn">☰</button>
            <h1>Xylora AI</h1>
          </div>
          <div class="header-right">
            <img id="header-avatar" src="" alt="user" class="avatar">
          </div>
        </header>

        <div class="messages-container" id="chat-box">
          <div class="welcome-message">
            <div class="welcome-icon">✨</div>
            <h2>Welcome to Xylora AI</h2>
            <p>Ask me anything – I’m here to help, create, and explore ideas with you.</p>
          </div>
        </div>

        <div class="input-container">
          <div class="input-wrapper">
            <textarea id="user-input" rows="1" placeholder="Message Xylora..." autocomplete="off"></textarea>
            <button id="send-btn" class="send-btn" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
          <p class="footer-note">Xylora can make mistakes. Check important info.</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Single module script: all Firebase + app logic -->
  <script type="module" src="app.js"></script>
</body>
</html>
